services:
  wafer-movie-api:
    container_name: wafer-movie-api
    image: ghcr.io/mohammad-hosein-shahpouri/wafer-movie-api:v${IMAGE_TAG:-latest}
    stdin_open: true
    tty: true
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Tehran
      PORT: 8080
      ENVIRONMENT: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: WaferMovie
      POSTGRES_PASSWORD: Qwer@#1234
      POSTGRES_DB: WaferMovie.App
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: 103Tx^YqUB9WwWnHT^94
      JWT_ISSUER: LocalHost
      JWT_AUDIENCE: LocalHost
    restart: always
    hostname: wafer-movie
    networks:
      - wafer-movie
    volumes:
      - wafer-movie-api-logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18-trixie
    restart: always
    networks:
      - wafer-movie
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: WaferMovie
      POSTGRES_PASSWORD: Qwer@#1234
      POSTGRES_DB: WaferMovie.App
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    restart: always
    networks:
      - wafer-movie
    ports:
      - "6379:6379"

networks:
  wafer-movie:

volumes:
  postgres-data:
  wafer-movie-api-logs:
